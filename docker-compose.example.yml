# Copy this file to docker-compose.yml, then run:  docker compose up -d
services:
  cuest:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - ./cuest-data:/data
    environment:
      CUEST_TZ: Europe/Amsterdam # change to your own time zone
    restart: unless-stopped
