<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcane Hearth home control</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&amp;family=Inter:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F7D27A}a:hover{color:#FFE7A8}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(247,210,122,.35)}50%{box-shadow:0 0 22px rgba(247,210,122,.7)}}
.spin{transform-origin:50% 50%;transform-box:fill-box;animation:spin 18s linear infinite}
.eq{transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.lit{animation:glow 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.spin,.eq,.lit{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 1640px; box-sizing: border-box; background: #14172A; font-family: Inter, sans-serif; color: #ECE4D2; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
  <h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 28px; color: #F7D27A">Spells</h1>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <button type="button" class="lit" style="min-height: 80px; border: 2px solid #C9A14A; background: #2A2340; color: #FFE7A8; border-radius: 14px; font: 600 12px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F7D27A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>All lights</button>
    <button type="button" style="min-height: 80px; border: 2px solid #33395F; background: #1D2140; color: #ECE4D2; border-radius: 14px; font: 600 12px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B98CFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>TV light</button>
    <button type="button" style="min-height: 80px; border: 2px solid #33395F; background: #1D2140; color: #ECE4D2; border-radius: 14px; font: 600 12px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8FDCFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4"/></svg>Wake PC</button>
    <button type="button" style="min-height: 80px; border: 2px solid #3E7A55; background: #1F3A2C; color: #CFEBD6; border-radius: 14px; font: 600 12px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7FD17E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Shield</button>
  </div>

  <div style="background: #2E3450; border: 2px solid #6B5A2E; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 64px; height: 64px; border-radius: 12px; background: #1D2140; border: 2px solid #C9A14A; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding: 10px; box-sizing: border-box">
        <i class="eq" style="width: 6px; height: 100%; background: #F7D27A"></i><i class="eq" style="width: 6px; height: 100%; background: #F7D27A; animation-delay: .2s"></i><i class="eq" style="width: 6px; height: 100%; background: #F7D27A; animation-delay: .5s"></i><i class="eq" style="width: 6px; height: 100%; background: #F7D27A; animation-delay: .3s"></i><i class="eq" style="width: 6px; height: 100%; background: #F7D27A; animation-delay: .7s"></i>
      </div>
      <div style="flex: 1"><div style="font-family: 'Pixelify Sans', monospace; font-size: 18px; color: #F7D27A">Bard · Wohnzimmer</div><div style="font-size: 13px; color: #CFC8DB">Lofi Radio · Music Assistant</div></div>
    </div>
    <div style="height: 6px; background: #4A5070; border-radius: 3px"><div style="width: 40%; height: 100%; background: linear-gradient(90deg, #D9862B, #FFE7A8); border-radius: 3px"></div></div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 16px">
      <button type="button" aria-label="Previous" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #4A5070; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ECE4D2" aria-hidden="true"><path d="M18 5L8 12l10 7zM6 5h2v14H6z"/></svg></button>
      <button type="button" aria-label="Pause" style="width: 62px; height: 62px; border-radius: 999px; border: 3px solid #C9A14A; background: #F7D27A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#2E3450" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
      <button type="button" aria-label="Next" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #4A5070; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ECE4D2" aria-hidden="true"><path d="M6 5l10 7-10 7zM16 5h2v14h-2z"/></svg></button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 13px">Volume<input type="range" value="35" style="flex: 1; accent-color: #F7D27A"></label>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; min-height: 44px; border: 2px solid #4A5070; background: transparent; color: #ECE4D2; border-radius: 12px; font: 600 13px Inter, sans-serif">Radio</button>
      <button type="button" style="flex: 1; min-height: 44px; border: 2px solid #4A5070; background: transparent; color: #ECE4D2; border-radius: 12px; font: 600 13px Inter, sans-serif">Playlists</button>
      <button type="button" style="flex: 1; min-height: 44px; border: 2px solid #4A5070; background: transparent; color: #ECE4D2; border-radius: 12px; font: 600 13px Inter, sans-serif">Friendflix</button>
    </div>
  </div>

  <div style="display: flex; gap: 8px; overflow-x: auto">
    <button type="button" style="min-height: 44px; border: 2px solid #C9A14A; background: #F7D27A; color: #14172A; border-radius: 999px; padding: 0 16px; font: 700 13px Inter, sans-serif; white-space: nowrap">Wohnzimmer</button>
    <button type="button" style="min-height: 44px; border: 2px solid #33395F; background: #1D2140; color: #ECE4D2; border-radius: 999px; padding: 0 16px; font: 600 13px Inter, sans-serif; white-space: nowrap">Schlafzimmer</button>
    <button type="button" style="min-height: 44px; border: 2px solid #33395F; background: #1D2140; color: #ECE4D2; border-radius: 999px; padding: 0 16px; font: 600 13px Inter, sans-serif; white-space: nowrap">Küche</button>
    <button type="button" style="min-height: 44px; border: 2px solid #33395F; background: #1D2140; color: #ECE4D2; border-radius: 999px; padding: 0 16px; font: 600 13px Inter, sans-serif; white-space: nowrap">Büro</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" class="lit" style="text-align: left; min-height: 80px; border: 2px solid #C9A14A; background: #3A2E25; border-radius: 14px; padding: 12px; font: 400 13px Inter, sans-serif; color: #FFE7A8"><b style="font-size: 15px">Ceiling</b><br>On · 80 %</button>
    <button type="button" class="lit" style="text-align: left; min-height: 80px; border: 2px solid #C9A14A; background: #3A2E25; border-radius: 14px; padding: 12px; font: 400 13px Inter, sans-serif; color: #FFE7A8"><b style="font-size: 15px">Spots</b><br>11 on · warm</button>
    <button type="button" style="text-align: left; min-height: 80px; border: 2px solid #33395F; background: #1D2140; border-radius: 14px; padding: 12px; font: 400 13px Inter, sans-serif; color: #A9A3BE"><b style="font-size: 15px; color: #ECE4D2">Lamp</b><br>Off</button>
    <button type="button" style="text-align: left; min-height: 80px; border: 2px solid #33395F; background: #1D2140; border-radius: 14px; padding: 12px; font: 400 13px Inter, sans-serif; color: #A9A3BE"><b style="font-size: 15px; color: #ECE4D2">Robot vacuum</b><br>Docked · tap to clean</button>
  </div>

  <div style="background: #1D2140; border: 2px solid #33395F; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px">
    <svg width="110" height="110" viewBox="0 0 120 120" role="img" aria-label="Heating: now 21.5, target 23 degrees">
      <circle class="spin" cx="60" cy="60" r="56" fill="none" stroke="#6B5A2E" stroke-width="2" stroke-dasharray="1 7"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#2C3256" stroke-width="10"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#FF8A5B" stroke-width="10" stroke-linecap="round" stroke-dasharray="207 277" transform="rotate(-90 60 60)"/>
      <text x="60" y="58" text-anchor="middle" font-family="Pixelify Sans, monospace" font-size="22" fill="#FFE7A8">23°</text>
      <text x="60" y="78" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#A9A3BE">now 21.5°</text>
    </svg>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
      <b style="font-size: 15px">Fire rune · heating</b>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="Cooler" style="width: 48px; height: 48px; border-radius: 12px; border: 2px solid #33395F; background: #14172A; color: #8FDCFF; font: 700 20px Inter, sans-serif">−</button>
        <button type="button" aria-label="Warmer" style="width: 48px; height: 48px; border-radius: 12px; border: 2px solid #6B5A2E; background: #14172A; color: #FFB27A; font: 700 20px Inter, sans-serif">+</button>
      </div>
    </div>
  </div>

  <h2 style="margin: 4px 0 0; font-family: 'Pixelify Sans', monospace; font-size: 18px; color: #F7D27A">Scenes</h2>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="min-height: 56px; border: 2px solid #33395F; background: #1D2140; color: #ECE4D2; border-radius: 12px; font: 600 13px Inter, sans-serif">Cozy evening</button>
    <button type="button" style="min-height: 56px; border: 2px solid #33395F; background: #1D2140; color: #ECE4D2; border-radius: 12px; font: 600 13px Inter, sans-serif">Movie night</button>
    <button type="button" style="min-height: 56px; border: 2px solid #33395F; background: #1D2140; color: #ECE4D2; border-radius: 12px; font: 600 13px Inter, sans-serif">Power sprint</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
